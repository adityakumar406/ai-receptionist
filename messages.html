
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | AI Receptionist</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            flex: 0 0 255px;
            width: 255px;
            padding: 22px 16px;
            background: #111827;
            color: white;
        }

        .sidebar h2 { margin: 0 0 24px; font-size: 27px; }

        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 8px;
            font-size: 17px;
            border-radius: 6px;
        }

        .sidebar a:hover { background: #273449; }
        .sidebar a.active { font-weight: bold; }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 25px;
        }

        .page-header h1 { margin: 0 0 8px; font-size: 30px; }
        .page-header p { margin: 0; color: #64748b; }

        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 220px;
            max-width: 100%;
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled { opacity: .6; cursor: not-allowed; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-export { background: #047857; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #64748b; color: white; }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .04);
            min-width: 0;
        }

        .card h2 { margin: 0 0 22px; font-size: 22px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
            min-width: 0;
        }

        .full-width { grid-column: 1 / -1; }
        label { font-weight: 600; }

        input, textarea, select {
            width: 100%;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
            background: white;
        }

        textarea { min-height: 90px; resize: vertical; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row input { width: auto; }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            grid-column: 1 / -1;
        }

        .search-input { margin-bottom: 20px; }

        .table-wrapper { width: 100%; overflow-x: auto; }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        th { background: #f8fafc; }

        .table-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .table-actions button { padding: 8px 11px; font-size: 13px; }

        .status-message {
            display: none;
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .status-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .status-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state { padding: 20px; text-align: center; color: #64748b; }

        @media (max-width: 900px) {
            .sidebar { flex-basis: 220px; width: 220px; }
            .main-content { padding: 22px; }
        }

        @media (max-width: 650px) {
            .app-layout { flex-direction: column; }
            .sidebar {
                flex: none;
                width: 100%;
                min-height: auto;
                padding: 16px;
            }

            .sidebar h2 { font-size: 24px; margin-bottom: 12px; }

            .sidebar nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .sidebar a { font-size: 15px; }
            .main-content { padding: 16px; }
            .header-actions { width: 100%; }
            .form-grid { grid-template-columns: minmax(0, 1fr); }
            .full-width, .form-actions { grid-column: auto; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <h2>AI Receptionist</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="calls.html">Calls</a>
            <a href="messages.html" class="active">Messages</a>
            <a href="faqs.html">FAQs</a>
            <a href="contacts.html">Contacts</a>
            <a href="urgent.html">Urgent Issues</a>
            <a href="settings.html">Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Messages</h1>
                <p>Manage messages received by your AI receptionist.</p>
            </div>
            <div class="header-actions">
                <button type="button" id="exportBtn" class="btn-export">Export CSV</button>
                <button type="button" id="showFormBtn" class="btn-primary">+ Add Message</button>
            </div>
        </header>

        <div id="statusMessage" class="status-message" role="status"></div>

        <section class="card" id="messageFormCard" hidden>
            <h2 id="formTitle">Add Message</h2>
            <form id="messageForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="senderName">Sender Name *</label>
                        <input id="senderName" required maxlength="150">
                    </div>

                    <div class="form-group">
                        <label for="senderPhone">Sender Phone</label>
                        <input id="senderPhone" type="tel" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <input id="platform" maxlength="100" placeholder="e.g. phone, WhatsApp, website">
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <input id="status" maxlength="100" placeholder="e.g. unread, read, resolved">
                    </div>

                    <div class="form-group full-width">
                        <label for="message">Message *</label>
                        <textarea id="message" required maxlength="20000"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="aiReply">AI Reply</label>
                        <textarea id="aiReply" maxlength="20000"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="intent">Intent</label>
                        <input id="intent" maxlength="500">
                    </div>

                    <div class="form-group full-width">
                        <label class="checkbox-row" for="isUrgent">
                            <input id="isUrgent" type="checkbox">
                            Mark as urgent
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="saveBtn" class="btn-primary">Save Message</button>
                        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>All Messages</h2>
            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search sender, phone, platform, message, intent or status..."
                aria-label="Search messages"
            >

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Sender</th>
                            <th>Phone</th>
                            <th>Platform</th>
                            <th>Message</th>
                            <th>AI Reply</th>
                            <th>Intent</th>
                            <th>Status</th>
                            <th>Urgent</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTableBody">
                        <tr><td colspan="10" class="empty-state">Loading messages...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { supabase } from './js/supabase.js';

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let messages = [];
    let editingMessageId = null;
    let busy = false;

    function showStatus(message, type = 'success') {
        $('statusMessage').textContent = message;
        $('statusMessage').className = `status-message ${type}`;
    }

    function clearStatus() {
        $('statusMessage').textContent = '';
        $('statusMessage').className = 'status-message';
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function setBusy(value) {
        busy = value;
        $('saveBtn').disabled = value;
        $('exportBtn').disabled = value;
    }

    function openForm(item = null) {
        clearStatus();
        $('messageForm').reset();

        editingMessageId = item?.id ?? null;
        $('formTitle').textContent = item ? 'Edit Message' : 'Add Message';
        $('saveBtn').textContent = item ? 'Update Message' : 'Save Message';

        if (item) {
            $('senderName').value = item.sender_name ?? '';
            $('senderPhone').value = item.sender_phone ?? '';
            $('platform').value = item.platform ?? '';
            $('message').value = item.message ?? '';
            $('aiReply').value = item.ai_reply ?? '';
            $('intent').value = item.intent ?? '';
            $('status').value = item.status ?? '';
            $('isUrgent').checked = item.is_urgent === true;
        }

        $('messageFormCard').hidden = false;
        $('messageFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        $('senderName').focus();
    }

    function closeForm() {
        $('messageForm').reset();
        editingMessageId = null;
        $('messageFormCard').hidden = true;
        $('formTitle').textContent = 'Add Message';
        $('saveBtn').textContent = 'Save Message';
    }

    function renderMessages() {
        const query = $('searchInput').value.trim().toLowerCase();

        const filtered = messages.filter(item => [
            item.sender_name,
            item.sender_phone,
            item.platform,
            item.message,
            item.ai_reply,
            item.intent,
            item.status,
            item.is_urgent ? 'urgent' : 'not urgent'
        ].join(' ').toLowerCase().includes(query));

        if (!filtered.length) {
            $('messagesTableBody').innerHTML = `
                <tr><td colspan="10" class="empty-state">
                    ${query ? 'No matching messages found.' : 'No messages found for this account.'}
                </td></tr>`;
            return;
        }

        $('messagesTableBody').innerHTML = filtered.map(item => `
            <tr>
                <td>${escapeHtml(item.sender_name || '—')}</td>
                <td>${escapeHtml(item.sender_phone || '—')}</td>
                <td>${escapeHtml(item.platform || '—')}</td>
                <td>${escapeHtml(item.message || '—')}</td>
                <td>${escapeHtml(item.ai_reply || '—')}</td>
                <td>${escapeHtml(item.intent || '—')}</td>
                <td>${escapeHtml(item.status || '—')}</td>
                <td>${item.is_urgent ? 'Yes' : 'No'}</td>
                <td>${escapeHtml(item.created_at
                    ? new Date(item.created_at).toLocaleString()
                    : '—')}</td>
                <td>
                    <div class="table-actions">
                        <button type="button" class="btn-primary"
                            data-action="edit" data-id="${escapeHtml(item.id)}">Edit</button>
                        <button type="button" class="btn-danger"
                            data-action="delete" data-id="${escapeHtml(item.id)}">Delete</button>
                    </div>
                </td>
            </tr>`).join('');
    }

    async function loadMessages() {
        $('messagesTableBody').innerHTML =
            '<tr><td colspan="10" class="empty-state">Loading messages...</td></tr>';

        const { data, error } = await supabase
            .from('messages')
            .select('id, user_id, sender_name, sender_phone, platform, message, ai_reply, intent, is_urgent, status, created_at')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Load messages error:', error);
            $('messagesTableBody').innerHTML =
                '<tr><td colspan="10" class="empty-state">Could not load messages.</td></tr>';
            showStatus(error.message, 'error');
            return false;
        }

        messages = data ?? [];
        renderMessages();
        return true;
    }

    $('messageForm').addEventListener('submit', async event => {
        event.preventDefault();
        if (busy) return;

        clearStatus();

        const payload = {
            sender_name: $('senderName').value.trim(),
            sender_phone: $('senderPhone').value.trim() || null,
            platform: $('platform').value.trim() || null,
            message: $('message').value.trim(),
            ai_reply: $('aiReply').value.trim() || null,
            intent: $('intent').value.trim() || null,
            status: $('status').value.trim() || null,
            is_urgent: $('isUrgent').checked
        };

        if (!payload.sender_name || !payload.message) {
            showStatus('Please enter the sender name and message.', 'error');
            return;
        }

        const wasEditing = Boolean(editingMessageId);
        setBusy(true);

        try {
            let result;

            if (wasEditing) {
                result = await supabase
                    .from('messages')
                    .update(payload)
                    .eq('id', editingMessageId)
                    .eq('user_id', currentUser.id)
                    .select('id');
            } else {
                result = await supabase
                    .from('messages')
                    .insert({ ...payload, user_id: currentUser.id })
                    .select('id');
            }

            if (result.error) throw result.error;

            if (wasEditing && (!result.data || result.data.length === 0)) {
                throw new Error('Message was not updated. Check your Supabase UPDATE policy.');
            }

            closeForm();
            const loaded = await loadMessages();

            if (loaded) {
                showStatus(wasEditing
                    ? 'Message updated successfully.'
                    : 'Message added successfully.');
            }
        } catch (error) {
            console.error('Save message error:', error);
            showStatus(error.message || 'Could not save message.', 'error');
        } finally {
            setBusy(false);
        }
    });

    $('messagesTableBody').addEventListener('click', async event => {
        const button = event.target.closest('button[data-action]');
        if (!button || busy) return;

        const item = messages.find(
            message => String(message.id) === button.dataset.id
        );

        if (!item) return;

        if (button.dataset.action === 'edit') {
            openForm(item);
            return;
        }

        if (button.dataset.action === 'delete') {
            if (!confirm(`Delete the message from "${item.sender_name || 'Unknown sender'}"?`)) {
                return;
            }

            clearStatus();
            setBusy(true);

            try {
                const { data, error } = await supabase
                    .from('messages')
                    .delete()
                    .eq('id', item.id)
                    .eq('user_id', currentUser.id)
                    .select('id');

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error('Message was not deleted. Check your Supabase DELETE policy.');
                }

                const loaded = await loadMessages();
                if (loaded) showStatus('Message deleted successfully.');
            } catch (error) {
                console.error('Delete message error:', error);
                showStatus(error.message || 'Could not delete message.', 'error');
            } finally {
                setBusy(false);
            }
        }
    });

    function csvCell(value) {
        let text = String(value ?? '');

        // Mitigate common spreadsheet formula-injection risks.
        if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;

        return '"' + text.replace(/"/g, '""') + '"';
    }

    function exportCSV() {
        clearStatus();

        if (!messages.length) {
            showStatus('There are no messages to export.', 'error');
            return;
        }

        const headers = [
            'Sender Name', 'Sender Phone', 'Platform', 'Message',
            'AI Reply', 'Intent', 'Urgent', 'Status', 'Created At'
        ];

        const rows = messages.map(item => [
            item.sender_name,
            item.sender_phone,
            item.platform,
            item.message,
            item.ai_reply,
            item.intent,
            item.is_urgent,
            item.status,
            item.created_at
        ]);

        const csv = [
            headers.map(csvCell).join(','),
            ...rows.map(row => row.map(csvCell).join(','))
        ].join('\r\n');

        const blob = new Blob(['\uFEFF' + csv], {
            type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download =
            `ai-receptionist-messages-${new Date().toISOString().slice(0, 10)}.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        showStatus(`${messages.length} message(s) exported successfully.`);
    }

    $('showFormBtn').addEventListener('click', () => openForm());
    $('cancelBtn').addEventListener('click', closeForm);
    $('exportBtn').addEventListener('click', exportCSV);
    $('searchInput').addEventListener('input', renderMessages);

    async function initializePage() {
        const { data, error } = await supabase.auth.getUser();

        if (error || !data.user) {
            window.location.replace('login.html');
            return;
        }

        currentUser = data.user;
        await loadMessages();

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.replace('login.html');
            }
        });
    }

    initializePage().catch(error => {
        console.error('Initialization error:', error);
        showStatus('Could not initialize Messages. Check the browser console.', 'error');
    });
</script>
</body>
</html>
