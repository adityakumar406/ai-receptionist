<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - AI Receptionist</title>

    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>AI Receptionist</h1>

            <p class="subtitle">
                Create your account
            </p>


            <form id="signupForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit">

                    Create Account

                </button>

            </form>


            <p id="message"></p>


            <p class="switch-auth">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script type="module">

        import { supabase } from './js/supabase.js';


        const signupForm =
            document.getElementById('signupForm');

        const message =
            document.getElementById('message');


        signupForm.addEventListener('submit', async (event) => {

            event.preventDefault();


            const email =
                document.getElementById('email').value;

            const password =
                document.getElementById('password').value;


            message.textContent =
                'Creating account...';


            const { data, error } =
                await supabase.auth.signUp({

                    email: email,

                    password: password

                });


            if (error) {

                message.textContent =
                    error.message;

                return;

            }


            message.textContent =
                'Account created successfully!';


            setTimeout(() => {

                window.location.href =
                    './login.html';

            }, 1000);

        });

    </script>

</body>

</html>
